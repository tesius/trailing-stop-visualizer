services:
  app:
    build: .
    container_name: trailing-stop
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - DATA_DIR=/app/data
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
    volumes:
      - trailing-stop-data:/app/data

volumes:
  trailing-stop-data:
