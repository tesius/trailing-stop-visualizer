name: Deploy
on:
  push:
    branches: [main]
env:
  DOCKER_HOST: unix:///Users/glen/.colima/default/docker.sock
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build and deploy
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          docker compose build
          docker compose down
          docker compose up -d
